name: cpp-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check test isolation
        run: |
          bash scripts/ci/check_test_isolation.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov gcovr ccache ninja-build
      - name: Configure ccache
        run: |
          ccache --zero-stats || true
          ccache --max-size=500M || true
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: ccache-coverage-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-coverage-${{ runner.os }}-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build -j $(nproc) --output-on-failure --output-junit junit-results.xml
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-coverage
          path: build/junit-results.xml
          retention-days: 7
      - name: Publish Test Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/junit-results.xml
      - name: Collect coverage
        run: |
          mkdir coverage
          lcov --capture --directory build --output-file coverage/coverage.info
          lcov --remove coverage/coverage.info '/usr/*' --output-file coverage/coverage.info
          gcovr --root . --object-directory build --xml-pretty --output coverage/coverage.xml --html-details coverage/coverage.html --print-summary --fail-under-line 60
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage
          retention-days: 7
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/coverage.info
          fail_ci_if_error: false
      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats || true
