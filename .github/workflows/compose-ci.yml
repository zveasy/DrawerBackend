name: Compose CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  hardening-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check test isolation
        run: |
          bash scripts/ci/check_test_isolation.sh

      - name: Apply hardening
        run: scripts/hardening/apply_hardening.sh

      - name: Verify hardening
        run: scripts/hardening/verify_hardening.sh

  unit-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [none, asan-ubsan]
        shard_index: [1, 2, 3, 4]
        shard_total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgpiod-dev libssl-dev ca-certificates ccache ninja-build

      - name: Configure ccache
        run: |
          ccache --zero-stats || true
          ccache --max-size=500M || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.sanitizer }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Configure (BUILD_TESTING=ON)
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan-ubsan" ]; then
            SAN_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1"
          else
            SAN_FLAGS=""
          fi
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DUSE_MOCK_GPIO=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$SAN_FLAGS"

      - name: Build
        run: |
          cmake --build build -j

      - name: Run unit tests
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_leaks=1:check_initialization_order=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          if [ -n "${TEST_LABEL}" ]; then
            echo "Running tests with label '${TEST_LABEL}'"
            ctest --test-dir build -j $(nproc) -L "${TEST_LABEL}" \
              --output-on-failure --output-junit junit-results-labeled.xml
          else
            ctest --test-dir build -j $(nproc) -I ${{ matrix.shard_index }},999999,${{ matrix.shard_total }} \
              --output-on-failure --output-junit junit-results-${{ matrix.shard_index }}.xml
          fi
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.compiler }}-${{ matrix.sanitizer }}-${{ matrix.shard_index }}of${{ matrix.shard_total }}
          path: |
            build/junit-results-${{ matrix.shard_index }}.xml
            build/junit-results-labeled.xml
          retention-days: 7
      - name: Publish Test Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/junit-results-*.xml
      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats || true

  unit-tests-tsan:
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgpiod-dev libssl-dev ca-certificates ccache ninja-build

      - name: Configure ccache
        run: |
          ccache --zero-stats || true
          ccache --max-size=500M || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: ccache-${{ runner.os }}-clang-tsan-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-

      - name: Configure (TSAN)
        env:
          CC: clang
          CXX: clang++
        run: |
          SAN_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1"
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DUSE_MOCK_GPIO=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$SAN_FLAGS"

      - name: Build
        run: |
          cmake --build build -j

      - name: Run unit tests (TSAN)
        env:
          TSAN_OPTIONS: halt_on_error=1:report_atomic_races=0
        run: |
          ctest --test-dir build -j $(nproc) --output-on-failure --output-junit junit-results.xml

      - name: Upload JUnit results (TSAN)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-clang-tsan
          path: build/junit-results.xml
          retention-days: 7

      - name: Publish Test Report (TSAN)
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/junit-results.xml

      - name: Show ccache stats (TSAN)
        if: always()
        run: |
          ccache --show-stats || true

  square-webhooks-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r integrations/pos/square/webhook_service/requirements-test.txt
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          pytest -q integrations/pos/square/webhook_service/tests
  build-and-healthcheck:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (main branch)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build images with BuildKit cache
        uses: docker/bake-action@v5
        with:
          files: |
            ./docker-bake.hcl
            ./docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.labels=org.opencontainers.image.revision=${{ github.sha }}
            *.labels=org.opencontainers.image.source=https://github.com/${{ github.repository }}
          targets: |
            api
            pos
            api_tui
            square_webhooks

      - name: Vulnerability scan (api)
        uses: anchore/scan-action@v4
        with:
          image: register_mvp-api:local
          output-format: sarif
          output-file: anchore-api.sarif
          fail-build: false
          severity-cutoff: high

      - name: Upload SARIF (api)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: anchore-api.sarif

      - name: Vulnerability scan (pos)
        uses: anchore/scan-action@v4
        with:
          image: register_mvp-pos:local
          output-format: sarif
          output-file: anchore-pos.sarif
          fail-build: false
          severity-cutoff: high

      - name: Upload SARIF (pos)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: anchore-pos.sarif

      - name: Vulnerability scan (api_tui)
        uses: anchore/scan-action@v4
        with:
          image: register_mvp-api_tui:local
          output-format: sarif
          output-file: anchore-api_tui.sarif
          fail-build: false
          severity-cutoff: high

      - name: Vulnerability scan (square_webhooks)
        uses: anchore/scan-action@v4
        with:
          image: drawerbackend-square_webhooks:local
          output-format: sarif
          output-file: anchore-square_webhooks.sarif
          fail-build: false
          severity-cutoff: high

      - name: Upload SARIF (api_tui)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: anchore-api_tui.sarif

      - name: Upload SARIF (square_webhooks)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: anchore-square_webhooks.sarif

      - name: Generate SBOM (api)
        uses: anchore/sbom-action@v0
        with:
          image: register_mvp-api:local
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Generate SBOM (pos)
        uses: anchore/sbom-action@v0
        with:
          image: register_mvp-pos:local
          format: spdx-json
          output-file: sbom-pos.spdx.json

      - name: Generate SBOM (api_tui)
        uses: anchore/sbom-action@v0
        with:
          image: register_mvp-api_tui:local
          format: spdx-json
          output-file: sbom-api_tui.spdx.json

      - name: Generate SBOM (square_webhooks)
        uses: anchore/sbom-action@v0
        with:
          image: drawerbackend-square_webhooks:local
          format: spdx-json
          output-file: sbom-square_webhooks.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            sbom-api.spdx.json
            sbom-pos.spdx.json
            sbom-api_tui.spdx.json
            sbom-square_webhooks.spdx.json
          retention-days: 7

      - name: Push images to GHCR (main branch)
        if: github.ref == 'refs/heads/main'
        uses: docker/bake-action@v5
        with:
          files: |
            ./docker-bake.hcl
            ./docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            api.tags=ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            api.push=true
            pos.tags=ghcr.io/${{ github.repository }}-pos:${{ github.sha }}
            pos.push=true
            api_tui.tags=ghcr.io/${{ github.repository }}-api_tui:${{ github.sha }}
            api_tui.push=true
            square_webhooks.tags=ghcr.io/${{ github.repository }}-square_webhooks:${{ github.sha }}
            square_webhooks.push=true
          targets: |
            api
            pos
            api_tui
            square_webhooks

      - name: Push latest tags to GHCR (main branch and schedule)
        if: github.ref == 'refs/heads/main'
        uses: docker/bake-action@v5
        with:
          files: |
            ./docker-bake.hcl
            ./docker-compose.yml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            api.tags=ghcr.io/${{ github.repository }}-api:latest
            api.push=true
            pos.tags=ghcr.io/${{ github.repository }}-pos:latest
            pos.push=true
            api_tui.tags=ghcr.io/${{ github.repository }}-api_tui:latest
            api_tui.push=true
            square_webhooks.tags=ghcr.io/${{ github.repository }}-square_webhooks:latest
            square_webhooks.push=true
          targets: |
            api
            pos
            api_tui
            square_webhooks

      - name: Start services (no rebuild)
        env:
          LOG_JSON: "1"
          BIND_ADDR: "0.0.0.0"
          API_PORT: "8080"
          POS_PORT: "9090"
          DOCS_PORT: "8082"
          API_TUI_PORT: "8081"
          SQUARE_WEBHOOKS_PORT: "8085"
          ZMQ_ENDPOINT: "tcp://localhost:5555"
          ZMQ_TOPIC: "register/stream"
          CLIENT_ID: "REG-CLIENT"
          HMAC_KEY_HEX: ""
          DEFAULT_RESERVE_FLOOR_CENTS: "2000"
        run: |
          docker compose up -d --no-build api pos docs api_tui square_webhooks

      - name: Wait for health
        run: |
          set -e
          services=(api pos docs api_tui square_webhooks)
          for s in "${services[@]}"; do
            echo "Waiting for $s to be healthy..."
            for i in {1..60}; do
              status=$(docker inspect --format='{{json .State.Health.Status}}' "drawerbackend-${s}-1" | tr -d '"') || status=starting
              echo "$s: $status"
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ $i -eq 60 ]; then
                echo "Service $s failed to become healthy" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Curl endpoints
        run: |
          curl -fsS http://localhost:8080/status | head -c 200 >/dev/null
          curl -fsS http://localhost:9090/ping | head -c 200 >/dev/null
          curl -fsS http://localhost:8082/ | head -c 200 >/dev/null
          curl -fsS http://localhost:8081/status | head -c 200 >/dev/null
          curl -fsS http://localhost:8085/health | head -c 200 >/dev/null

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color | tee compose-logs.txt

      - name: Upload compose logs (artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-build-health
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          docker compose down -v

  unit-tests-timing:
    if: github.event_name == 'schedule'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgpiod-dev libssl-dev ca-certificates ccache ninja-build

      - name: Configure ccache
        run: |
          ccache --zero-stats || true
          ccache --max-size=500M || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: ccache-${{ runner.os }}-timing-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure (timing)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DUSE_MOCK_GPIO=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build -j

      - name: Run tests to collect timing (CTest Dashboard)
        run: |
          ctest --test-dir build -T Test -j $(nproc) --output-on-failure || true

      - name: Upload CTest timing data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-testing-timings
          path: build/Testing
          retention-days: 7

  docs-prod-check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docs (prod profile)
        env:
          DOCS_PORT: "8082"
        run: |
          docker compose --profile prod up docs_build

      - name: Export built docs site artifact
        run: |
          # Volume name follows default compose project naming (folder-based)
          docker run --rm -v drawerbackend_docs_site:/site -v "$GITHUB_WORKSPACE":/out alpine sh -c "cd /site && tar czf /out/docs_site.tgz ."
      
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs_site
          path: docs_site.tgz
          retention-days: 7

      - name: Serve built docs and verify
        env:
          DOCS_PORT: "8082"
        run: |
          docker compose --profile prod up -d docs_prod
          # wait for container health (leverages docs_prod healthcheck)
          for i in {1..60}; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' "drawerbackend-docs_prod-1" | tr -d '"') || status=starting
            echo "docs_prod: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ $i -eq 60 ]; then echo "docs_prod failed to become healthy" >&2; exit 1; fi
            sleep 2
          done
          # final HTTP verification
          curl -fsS http://localhost:${DOCS_PORT}/ | head -c 200 >/dev/null

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down prod docs
        if: always()
        run: |
          docker compose --profile prod down -v
